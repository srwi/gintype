org.gradle.parallel = true
org.gradle.caching = true
kotlin.code.style = official
version = 1.0.0
# Local builds need Morphe GitHub Packages credentials with read:packages scope (ideally set in ~/.gradle/gradle.properties)
gpr.user=YOUR_GITHUB_USERNAME
gpr.key=YOUR_GITHUB_PERSONAL_ACCESS_TOKEN
android.builder.sdkDownload=true
android.aapt2Override=/data/data/com.termux/files/usr/bin/aapt2
