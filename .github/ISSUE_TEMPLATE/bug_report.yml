name: Bug Report
description: Report patching, installation, crashes, or unexpected behavior.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please write issues in English and report one problem per issue.

        If you also apply patches from other bundles, test first on an unmodified Gboard APK using only Gboard Multiswipe to confirm where the issue originates.
  - type: textarea
    id: bug-description
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected to happen.
      placeholder: |
        Actual behavior:

        Expected behavior:
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: If the problem is intermittent, describe how often it happens and under which conditions.
      placeholder: |
        1. Open ...
        2. Enable ...
        3. ...
    validations:
      required: true
  - type: input
    id: patches-version
    attributes:
      label: Gboard Multiswipe version
      description: Find this in Gboard Settings > Multiswipe & Matrix > About (or release tag).
      placeholder: Exact patch bundle version (e.g. 4.2.0)
    validations:
      required: true
  - type: textarea
    id: device-and-system
    attributes:
      label: Device and Android version
      description: Include your device model and Android version.
      placeholder: |
        Device: Pixel 9
        Android: Android 16
    validations:
      required: true
  - type: input
    id: manager-version
    attributes:
      label: Morphe Manager / CLI version
      description: Required for patching or installation failures.
      placeholder: Exact Morphe Manager or CLI version
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Confirm both items before submitting.
      options:
        - label: I have checked existing issues and this is not a duplicate.
          required: true
        - label: I reproduced this using the supported Gboard target version (18.5.4.993608717-release-arm64-v8a).
          required: true
