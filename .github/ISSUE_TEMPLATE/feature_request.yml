name: Feature Request
description: Suggest an improvement for Gboard Multiswipe or Matrix Word Suggestions.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please write feature requests in English and describe one idea per issue.
  - type: textarea
    id: requested-behavior
    attributes:
      label: Describe the solution you'd like
      description: Explain how you would use the feature and the behavior you expect.
      placeholder: I would like to ... so that ...
    validations:
      required: true
